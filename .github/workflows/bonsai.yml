name: git-bonsai
on:
  schedule:
    - cron: "0 0 * * *" # regrows daily
  workflow_dispatch: {} # lets you run it manually

jobs:
  bonsai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # NOTE: egorthinks/git-bonsai commits output/*.gif itself to main.
      # Do NOT add an auto-commit step — it finds nothing and only confuses.
      - uses: egorthinks/git-bonsai@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
